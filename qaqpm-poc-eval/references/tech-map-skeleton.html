<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>QAQPM 技术链路</title>
<style>
:root{--bg:#0b1020;--panel:#121a2f;--fg:#e7eefc;--muted:#93a0b8;--line:#243356;--accent:#5b9dff;--ai:#a78bfa;--ok:#34d399;--warn:#fbbf24}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;min-height:100vh}
header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.15rem} .sub{color:var(--muted);font-size:.85rem}
.tabs button,.tool button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;margin-right:6px}
.tabs button.active{border-color:var(--accent);color:var(--accent)}
.layout{display:grid;grid-template-columns:1fr 300px;gap:0;flex:1;min-height:0}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
#canvas-wrap{position:relative;overflow:auto;border-right:1px solid var(--line);background:radial-gradient(circle at 20% 20%,#152042,#0b1020 55%)}
svg{width:100%;min-height:560px;display:block}
.node rect{stroke:var(--line);stroke-width:1.5;rx:10}.node.client rect{fill:#1a2744}.node.backend rect{fill:#172a3a}.node.ai rect{fill:#2a1f44}.node.data rect{fill:#1f2f28}
.node text{fill:var(--fg);font-size:12px}.node.primary rect{stroke:var(--accent);stroke-width:2.5}
.edge{stroke:#5b6b88;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.edge.primary{stroke:var(--accent);stroke-width:2.5}
.edge-label{fill:var(--muted);font-size:10px}
aside{padding:14px;background:var(--panel);overflow:auto}
aside h2{margin:0 0 8px;font-size:1rem} aside .ev{font-size:.72rem;padding:2px 6px;border-radius:999px;border:1px solid;display:inline-block}
.ev.fact{color:var(--ok);border-color:var(--ok)}.ev.infer{color:var(--warn);border-color:var(--warn)}.ev.tbd{color:var(--muted);border-color:var(--muted)}
footer{padding:10px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">技术链路</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div>
    <div class="tabs" id="tabs"></div>
    <span class="tool"><button type="button" id="btn-path">高亮主路径</button></span>
  </div>
</header>
<div class="layout">
  <div id="canvas-wrap"><svg id="svg" viewBox="0 0 900 560">
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5b6b88"/></marker></defs>
    <g id="edges"></g><g id="nodes"></g>
  </svg></div>
  <aside>
    <h2>节点说明</h2>
    <div id="detail" class="sub">点击节点查看说明。数据来自 09-POC与选型.md，HTML 不新增事实。</div>
  </aside>
</div>
<footer>QAQPM · 仿 Archify 自包含交互演示 · 零依赖 · 证据层在 Markdown</footer>
<script type="application/json" id="tech-map-data">
{
  "meta": {
    "title": "示例技术链路（请替换）",
    "subtitle": "architecture / workflow / dataflow · 替换为本项目 JSON",
    "updated_at": "2026-10-28",
    "source_md": "09-POC与选型.md",
    "primary_path": ["web", "api", "llm"]
  },
  "views": [
    {
      "id": "architecture",
      "label": "架构",
      "nodes": [
        {"id": "web", "label": "Web/H5", "group": "client", "x": 80, "y": 220, "desc": "用户入口与播放/交互", "ev": "fact"},
        {"id": "api", "label": "API 编排", "group": "backend", "x": 360, "y": 220, "desc": "鉴权、任务、回调", "ev": "infer"},
        {"id": "llm", "label": "模型服务", "group": "ai", "x": 640, "y": 140, "desc": "推理 / 多模态", "ev": "tbd"},
        {"id": "db", "label": "存储", "group": "data", "x": 640, "y": 320, "desc": "元数据与产物", "ev": "infer"}
      ],
      "edges": [
        {"from": "web", "to": "api", "label": "HTTPS"},
        {"from": "api", "to": "llm", "label": "调用"},
        {"from": "api", "to": "db", "label": "读写"}
      ]
    },
    {
      "id": "workflow",
      "label": "主路径",
      "nodes": [
        {"id": "u1", "label": "上传/选择", "group": "client", "x": 60, "y": 240, "desc": "用户提交任务", "ev": "fact"},
        {"id": "u2", "label": "确认点", "group": "client", "x": 280, "y": 240, "desc": "成本或方案确认", "ev": "infer"},
        {"id": "u3", "label": "生成中", "group": "ai", "x": 500, "y": 240, "desc": "异步任务", "ev": "infer"},
        {"id": "u4", "label": "交付/改", "group": "client", "x": 720, "y": 240, "desc": "验收与局部重做", "ev": "fact"}
      ],
      "edges": [
        {"from": "u1", "to": "u2", "label": "下一步"},
        {"from": "u2", "to": "u3", "label": "提交"},
        {"from": "u3", "to": "u4", "label": "完成"}
      ]
    },
    {
      "id": "dataflow",
      "label": "数据流",
      "nodes": [
        {"id": "d1", "label": "用户输入", "group": "client", "x": 80, "y": 240, "desc": "原始材料", "ev": "fact"},
        {"id": "d2", "label": "特征/索引", "group": "backend", "x": 360, "y": 240, "desc": "预处理", "ev": "infer"},
        {"id": "d3", "label": "模型 I/O", "group": "ai", "x": 640, "y": 240, "desc": "提示词与输出", "ev": "tbd"}
      ],
      "edges": [
        {"from": "d1", "to": "d2", "label": "ingest"},
        {"from": "d2", "to": "d3", "label": "context"}
      ]
    }
    ,
    {
      "id": "rag-online",
      "label": "RAG主路径",
      "nodes": [
        {"id": "rq", "label": "Query增强", "group": "ai", "x": 40, "y": 200, "desc": "改写/澄清/意图", "ev": "infer"},
        {"id": "rr", "label": "路由", "group": "backend", "x": 200, "y": 200, "desc": "多库选择", "ev": "infer"},
        {"id": "rc", "label": "召回Top-K", "group": "data", "x": 360, "y": 120, "desc": "向量/关键词多路", "ev": "infer"},
        {"id": "rk", "label": "重排Top-N", "group": "ai", "x": 520, "y": 120, "desc": "Rerank", "ev": "infer"},
        {"id": "rg", "label": "生成", "group": "ai", "x": 680, "y": 200, "desc": "注入证据生成", "ev": "infer"},
        {"id": "rj", "label": "Judge/转人", "group": "backend", "x": 820, "y": 280, "desc": "低分人工复核", "ev": "fact"}
      ],
      "edges": [
        {"from": "rq", "to": "rr", "label": "下一步"},
        {"from": "rr", "to": "rc", "label": "检索"},
        {"from": "rc", "to": "rk", "label": "候选"},
        {"from": "rk", "to": "rg", "label": "上下文"},
        {"from": "rg", "to": "rj", "label": "评测"}
      ]
    }
  ]
}
</script>
<script>
(function(){
  const data=JSON.parse(document.getElementById('tech-map-data').textContent);
  document.getElementById('title').textContent=data.meta.title;
  document.getElementById('subtitle').textContent=data.meta.subtitle+' · '+data.meta.updated_at+' · 源: '+data.meta.source_md;
  const tabs=document.getElementById('tabs');
  let view=data.views[0], pathOn=false;
  data.views.forEach((v,i)=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=v.label; if(!i)b.classList.add('active');
    b.onclick=()=>{[...tabs.children].forEach(x=>x.classList.remove('active')); b.classList.add('active'); view=v; pathOn=false; render();};
    tabs.appendChild(b);
  });
  document.getElementById('btn-path').onclick=()=>{pathOn=!pathOn; render();};
  const nodeG=document.getElementById('nodes'), edgeG=document.getElementById('edges'), detail=document.getElementById('detail');
  function render(){
    nodeG.innerHTML=''; edgeG.innerHTML='';
    const byId=Object.fromEntries(view.nodes.map(n=>[n.id,n]));
    const primary=new Set(pathOn? (data.meta.primary_path||[]):[]);
    view.edges.forEach(e=>{
      const a=byId[e.from], b=byId[e.to]; if(!a||!b)return;
      const x1=a.x+120,y1=a.y+28,x2=b.x,y2=b.y+28;
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`);
      p.setAttribute('class','edge'+(primary.has(e.from)&&primary.has(e.to)?' primary':''));
      edgeG.appendChild(p);
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('class','edge-label'); t.setAttribute('x',(x1+x2)/2); t.setAttribute('y',(y1+y2)/2-6); t.textContent=e.label||''; edgeG.appendChild(t);
    });
    view.nodes.forEach(n=>{
      const g=document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('class','node '+(n.group||'')+(primary.has(n.id)?' primary':''));
      g.style.cursor='pointer';
      const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
      r.setAttribute('x',n.x); r.setAttribute('y',n.y); r.setAttribute('width',120); r.setAttribute('height',56);
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',n.x+60); t.setAttribute('y',n.y+32); t.setAttribute('text-anchor','middle'); t.textContent=n.label;
      g.appendChild(r); g.appendChild(t);
      g.onclick=()=>{detail.innerHTML=`<div><strong>${n.label}</strong> <span class="ev ${n.ev||'tbd'}">${n.ev||'tbd'}</span></div><p>${n.desc||''}</p><p class="sub">group: ${n.group||'-'}</p>`;};
      nodeG.appendChild(g);
    });
  }
  render();
})();
</script>
</body>
</html>
